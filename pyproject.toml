[project]
name = "kitti-visual-odometry"
version = "0.1.0"
description = "Stereo + LiDAR visual odometry on the KITTI odometry benchmark, with a real-time PyQtGraph dashboard."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "opencv-contrib-python>=5.0.0.93",
    "pandas>=3.0.5",
    "matplotlib>=3.11.1",
    "pyqtgraph>=0.13.7",
    "PyQt6>=6.7",
    "PyOpenGL>=3.1.7",
    "tqdm>=4.66",
    "ipykernel>=7.3.0",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=7.3.0",
    "ipympl>=0.10.0",
    "jupyterlab>=4.6.3",
    "jupyterlab-lsp>=5.3.0",
    "python-lsp-server[all]>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitti_vo"]
